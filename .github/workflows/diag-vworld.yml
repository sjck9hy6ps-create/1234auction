name: 진단 - VWorld 공시지가·정비구역 레이어
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - env:
          VWORLD_API_KEY: ${{ secrets.VWORLD_API_KEY }}
          PYTHONUNBUFFERED: '1'
        run: python diag-vworld.py
