name: 후발주자 신호 백테스트 (#480)

on:
  workflow_dispatch:
  schedule:
    # 매달 1일 UTC 20:00(KST 05:00) - 올해 실거래가 매주 쌓일수록 표본이 늘어나며
    # 정확도가 점점 올라가므로, 야간 웜업들처럼 매일 돌 필요는 없고 한 달에 한 번이면
    # 충분함(작년 12/31 컷오프 자체는 안 바뀜 - 올해가 끝나기 전까지는).
    - cron: '0 20 1 * *'

jobs:
  backtest-leader-follower:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 후발주자 신호 백테스트 실행
        env:
          SITE_URL: https://1234auction.vercel.app
        run: node scripts/backtest-leader-follower.mjs
