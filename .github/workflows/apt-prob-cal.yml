# 낙찰 가능성 보정만 다시 맞춰 서버에 저장(2026-11-14) - 아파트 과거 사례 재계산 결과(apt-case-rows)를 받아 save-prob-cal.py만 실행(낙찰가 모델·종합 평가 값은 건드리지 않음)
name: Apt prob cal
on:
  workflow_dispatch:
    inputs:
      rows_run_id:
        description: 'Apt case rows 실행 번호'
        required: true
jobs:
  cal:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - uses: actions/download-artifact@v4
        with:
          pattern: aptrows-*
          path: aptrows
          run-id: ${{ inputs.rows_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: set -o pipefail; python save-prob-cal.py aptrows | tee cal-log.txt
