name: 앱 자료 백업 (Redis)

# 경매물건·낙찰사례·임장메모·내 자산·실거래 장부는 Redis에 있어서 backup-full(Supabase)에 안 들어감 → 매주 앱 주소에서 내려받아 보관.
# 실패(응답 오류·빈 파일·JSON 아님)하면 빨간 표시. 내려받기: gh run download <run-id>
on:
  schedule:
    - cron: '0 18 * * 0'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/backup-app-data.sh backup
      - name: 내용 검증
        run: |
          for k in auctions bidCases siteNotes myAssets ledger; do
            python3 - "$k" <<'PY'
          import json, sys
          k = sys.argv[1]
          d = json.load(open(f'backup/{k}.json'))
          n = len(d) if hasattr(d, '__len__') else 1
          print(k, '항목', n)
          if k in ('auctions', 'ledger') and not n:
              sys.exit(f'{k} 비어 있음')
          PY
          done
      - uses: actions/upload-artifact@v4
        with:
          name: app-data-backup
          path: backup
          retention-days: 30
