name: 예상매도가(30th percentile) 백테스트 (#481)

on:
  workflow_dispatch:
  schedule:
    # 매달 1일 UTC 20:30(KST 05:30) - backtest-leader-follower와 겹치지 않게 30분 뒤로 둠.
    # 올해 실거래가 매주 쌓일수록 표본이 늘어나며 정확도가 점점 올라가므로, 야간 웜업들처럼
    # 매일 돌 필요는 없고 한 달에 한 번이면 충분함(작년 데이터 자체는 안 바뀌므로).
    - cron: '30 20 1 * *'

jobs:
  backtest-comp-estimate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 예상매도가 백테스트 실행
        env:
          SITE_URL: https://1234auction.vercel.app
        run: node scripts/backtest-comp-estimate.mjs
