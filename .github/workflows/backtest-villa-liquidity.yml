name: 백테스트 - 빌라 생활권 거래 활발도와 되팔림
on:
  workflow_dispatch:
jobs:
  bt:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests scipy
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SITE_URL: https://1234auction.vercel.app
          PYTHONUNBUFFERED: '1'
        run: python backtest-villa-liquidity.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backtest-villa-liquidity
          path: backtest-villa-liquidity.json
          if-no-files-found: ignore
          retention-days: 14
