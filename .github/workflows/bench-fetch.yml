name: 시험 - 거래 받기 속도(병렬 vs 순차)
on:
  workflow_dispatch:
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PYTHONUNBUFFERED: '1'
        run: |
          python - <<'PY'
          import importlib.util, time, os
          spec = importlib.util.spec_from_file_location("avm", "train-avm.py"); avm = importlib.util.module_from_spec(spec); spec.loader.exec_module(avm)
          cols = "region,dong,danji,price,size,floor,deal_date"
          for th in ("8", "16"):
              os.environ["FETCH_THREADS"] = th
              t = time.time(); b = avm.fetch_all_rows("villa_trades", cols=cols); tp = time.time() - t
              print(f"villa_trades 전체 {len(b)}행 · {th}줄 {tp:.0f}초 · 초당 {len(b)/max(tp,1):.0f}행 (순차 기준 약 1,490행/초)")
          PY
