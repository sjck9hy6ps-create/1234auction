# 낙찰사례 대규모 검증(2017~ 전체 실거래로 당시 예상매도가·낙찰 확률·재매도) - 2026-10 (analyze-bidcases.py 상단 설명 참고)
name: Analyze bid cases

on:
  workflow_call:       # 주간 파이프라인(weekly-pipeline.yml)이 순서대로 부름 - 단독 일정은 없앰(2026-10-11)
  push:                # 2026-11-04: 이 파일을 고쳐 올리면 바로 한 번 실행(Actions 화면을 못 열 때 git push로 구동) - 다른 파일 push에는 반응하지 않음
    paths: ['.github/triggers/analyze-bidcases.txt']
  workflow_dispatch:
    inputs:
      experiment:
        description: '예상 낙찰가 개선 실험도 함께 실행(앱 계산은 바뀌지 않음)'
        required: false
        default: 'false'
      nolb:
        description: '최저가 요인 제외 시험만 실행(저장 없음)'
        required: false
        default: 'false'

      basedist:
        description: '낙찰비율 분포 보고만 실행(저장 없음)'
        required: false
        default: 'false'

      noest:
        description: '시세 없는 사례 진단만 실행(저장 없음)'
        required: false
        default: 'false'

      recwin:
        description: '오늘 기준 최근 기간별 비교 시험만 실행(저장 없음)'
        required: false
        default: 'false'

      rwcheck:
        description: '최근 가중 기간별 재확인만 실행(저장 없음)'
        required: false
        default: 'false'

      alarmtest:
        description: '낙찰 가능성 경보 기준 구간별 시험만 실행(저장 없음)'
        required: false
        default: 'false'

      caltest:
        description: '낙찰 가능성 보정 방법 비교 시험만 실행(저장 없음)'
        required: false
        default: 'false'

      calfull:
        description: '낙찰 가능성 보정 전체 사례 재확인만 실행(저장 없음)'
        required: false
        default: 'false'

      season:
        description: '낙찰가율·응찰자 계절 vs 시장 시험만 실행(저장 없음)'
        required: false
        default: 'false'

      season2:
        description: '계절 vs 시장(지역 가격 지수 포함) 시험만 실행(저장 없음)'
        required: false
        default: 'false'

      factorsearch:
        description: '사건별 요인 후보·GBM·사건별 범위 시험만 실행(저장 없음)'
        required: false
        default: 'false'

      gbmapp:
        description: '앱 입력만 쓰는 GBM 보정 시험만 실행(저장 없음)'
        required: false
        default: 'false'

      xfcheck:
        description: '번지 기준 단지 이력 요인 4구간 확인만 실행(저장 없음)'
        required: false
        default: 'false'

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests scikit-learn
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}
          PYTHONUNBUFFERED: '1'
          WB_EXP: ${{ github.event.inputs.experiment == 'true' && '1' || '' }}
          WB_NOLB_ONLY: ${{ github.event.inputs.nolb == 'true' && '1' || '' }}
          WB_NOEST_DIAG: ${{ github.event.inputs.noest == 'true' && '1' || '' }}
          WB_XFCHECK: ${{ github.event.inputs.xfcheck == 'true' && '1' || '' }}
          WB_GBMAPP: ${{ github.event.inputs.gbmapp == 'true' && '1' || '' }}
          WB_FACTORSEARCH: ${{ (github.event.inputs.factorsearch == 'true' || github.event.inputs.gbmapp == 'true') && '1' || '' }}
          WB_FACTORSEARCH_OLD: ${{ github.event.inputs.factorsearch == 'true' && '1' || '' }}
          WB_SEASON2: ${{ github.event.inputs.season2 == 'true' && '1' || '' }}
          WB_SEASON: ${{ github.event.inputs.season == 'true' && '1' || '' }}
          WB_CALFULL: ${{ github.event.inputs.calfull == 'true' && '1' || '' }}
          WB_CALTEST: ${{ github.event.inputs.caltest == 'true' && '1' || '' }}
          WB_ALARMTEST: ${{ github.event.inputs.alarmtest == 'true' && '1' || '' }}
          WB_RW_RECHECK: ${{ github.event.inputs.rwcheck == 'true' && '1' || '' }}
          WB_RECWIN: ${{ github.event.inputs.recwin == 'true' && '1' || '' }}
          WB_BASEDIST_ONLY: ${{ github.event.inputs.basedist == 'true' && '1' || '' }}
          WRITE_BACK: ${{ (github.event.inputs.nolb == 'true' || github.event.inputs.basedist == 'true' || github.event.inputs.noest == 'true' || github.event.inputs.recwin == 'true' || github.event.inputs.rwcheck == 'true' || github.event.inputs.alarmtest == 'true' || github.event.inputs.caltest == 'true' || github.event.inputs.calfull == 'true' || github.event.inputs.season == 'true' || github.event.inputs.season2 == 'true' || github.event.inputs.factorsearch == 'true' || github.event.inputs.gbmapp == 'true' || github.event.inputs.xfcheck == 'true') && '0' || '1' }}
        run: python analyze-bidcases.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bidcases-R
          path: bidcases-R.csv.gz
          if-no-files-found: ignore
          retention-days: 14
