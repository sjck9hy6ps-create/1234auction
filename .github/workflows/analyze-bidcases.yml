# 낙찰사례 대규모 검증(2017~ 전체 실거래로 당시 예상매도가·낙찰 확률·재매도) - 2026-10 (analyze-bidcases.py 상단 설명 참고)
name: Analyze bid cases

on:
  workflow_call:       # 주간 파이프라인(weekly-pipeline.yml)이 순서대로 부름 - 단독 일정은 없앰(2026-10-11)
  workflow_dispatch: {}

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests scikit-learn
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}
          PYTHONUNBUFFERED: '1'
        run: python analyze-bidcases.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bidcases-R
          path: bidcases-R.csv.gz
          if-no-files-found: ignore
          retention-days: 14
