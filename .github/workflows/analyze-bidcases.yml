# 낙찰사례 대규모 검증(2017~ 전체 실거래로 당시 예상매도가·낙찰 확률·재매도) - 2026-10 (analyze-bidcases.py 상단 설명 참고)
name: Analyze bid cases

on:
  workflow_dispatch: {}
  # 2026-10: 낙찰사례 매도 매칭(전체 실거래 기준)도 여기서 저장 - 매주 금요일 KST 05:00
  schedule:
    - cron: '0 20 * * 0'   # 매주 월요일 KST 05:00 (2026-10 사용자: 주말에 낙찰사례·신규 경매를 올리고 월요일에 분석)

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}
          PYTHONUNBUFFERED: '1'
        run: python analyze-bidcases.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bidcases-R
          path: bidcases-R.csv.gz
          if-no-files-found: ignore
          retention-days: 14
