# 빌라 과거 낙찰 사례 채점(2026-11-10) - 앱 실제 계산(추천가·예상 낙찰가·낙찰 가능성)을 가상 브라우저에서 돌려 실제 낙찰가와 비교.
# 멈춤을 피하는 장치: 외부·서버 API 호출을 아예 만들지 않음(가상 브라우저 안에서 빈 응답), 서버가 느려도 기다렸다 계속, 묶음마다 저장·실패하면 새 브라우저로 쪼개 이어하기, 죽으면 자동 재시작, 겹쳐 돌지 않음
name: Score villa cases
on:
  workflow_dispatch:
    inputs:
      export_run_id:
        description: 'villa-cases-asof 워크플로 실행 번호(채점용 자료 artifact가 있는 실행)'
        required: true
concurrency:
  group: score-villa-cases-${{ inputs.export_run_id }}
  cancel-in-progress: false
jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/download-artifact@v4
        with:
          name: villa-cases-asof
          path: input
          run-id: ${{ inputs.export_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: npm install playwright
      - run: npx playwright install --with-deps chromium
      - name: 채점(중간에 죽으면 같은 파일에서 이어서 다시 - 최대 5번)
        env:
          SITE_URL: https://1234auction.vercel.app
          CASES: input/villa-cases-asof.json
          PRE_MODEL: input/villa-winbid-pre.json
          MAX_NET_CALLS: '40'
          BATCH: '150'
        run: |
          set -o pipefail
          for i in 1 2 3 4 5; do
            RESUME=1 node scripts/score-villa-cases.mjs 2>&1 | tee -a score-log.txt && break
            echo "비정상 종료($i회) - 30초 뒤 저장된 결과에서 이어서 다시" | tee -a score-log.txt; sleep 30
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: villa-score
          path: |
            villa-score.json
            villa-score-rows.json
            score-log.txt
          if-no-files-found: ignore
          retention-days: 30
