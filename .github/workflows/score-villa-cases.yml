# 빌라 과거 낙찰 사례 채점(2026-11-10) - 앱 실제 계산(추천가·예상 낙찰가·낙찰 가능성)을 가상 브라우저에서 돌려 실제 낙찰가와 비교.
# 한도 보호: 외부·서버 API 호출 전면 차단(스크립트 상단 설명), 요청 수·시간 상한, 겹쳐 돌지 않음, 입력은 villa-cases-asof 파일(서버를 새로 읽지 않음)
name: Score villa cases
on:
  workflow_dispatch:
    inputs:
      export_run_id:
        description: 'villa-cases-asof 워크플로 실행 번호(채점용 자료 artifact가 있는 실행)'
        required: true
concurrency:
  group: score-villa-cases
  cancel-in-progress: false
jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/download-artifact@v4
        with:
          name: villa-cases-asof
          path: input
          run-id: ${{ inputs.export_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: npm install playwright
      - run: npx playwright install --with-deps chromium
      - env:
          SITE_URL: https://1234auction.vercel.app
          CASES: input/villa-cases-asof.json
          PRE_MODEL: input/villa-winbid-pre.json
          MAX_NET_CALLS: '40'
          TIME_BUDGET_MIN: '40'
        run: node scripts/score-villa-cases.mjs | tee score-log.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: villa-score
          path: |
            villa-score.json
            villa-score-rows.json
            score-log.txt
          if-no-files-found: ignore
          retention-days: 30
