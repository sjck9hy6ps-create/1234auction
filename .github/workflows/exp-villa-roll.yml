# 빌라 시세 롤링 검증(2026-11-13): 분기별 학습→시험, 현재 운영 계산식
name: Exp villa roll
on:
  workflow_dispatch:
    inputs:
      official_run_id:
        description: '공시가격 수집 실행 번호'
        default: '43412988488'
      scale_run_id:
        description: 'Villa data scale 실행 번호(villa-df·조각 보관: 조각 14일, 거래 파일 7일)'
        default: '43010239831'
concurrency:
  group: exp-villa-roll
  cancel-in-progress: false
jobs:
  exp:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy scikit-learn scipy
      - uses: actions/download-artifact@v4
        with:
          name: villa-df
          path: input
          run-id: ${{ inputs.scale_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: feat-*
          path: shards
          run-id: ${{ inputs.scale_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: villa-official-price
          path: input2
          run-id: ${{ inputs.official_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - env:
          SHARD_GLOB: shards/**/feat-shard-*.pkl
          PYTHONUNBUFFERED: '1'
        run: set -o pipefail; python exp-villa-roll.py | tee roll-log.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: villa-roll-test
          path: |
            villa-roll-test.json
            roll-log.txt
          if-no-files-found: ignore
          retention-days: 30
