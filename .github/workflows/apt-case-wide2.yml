# 종합 평가 값을 더 많은 사례(2020년~, 전남광주 포함)로 계산해 정확도가 좋아지는지만 시험(2026-11-16) - 저장 없음(기존 저장값·보정값은 바뀌지 않음)
name: Apt case wide test 2 (older cases, long trade history)
on:
  workflow_dispatch:
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        prefix: ['11', '12', '26', '27', '28', '29', '30', '31', '36', '41', '42,51', '43', '44', '45,52', '46', '47', '48', '50']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install playwright
      - run: npx playwright install --with-deps chromium
      - env:
          SITE_URL: https://1234auction.vercel.app
          LAWD_PREFIX: ${{ matrix.prefix }}
          SALE_FROM: '2020-01-01'
          SALE_TO: '2025-02-15'
          LONG_YEARS: '6'
          OUT_FILE: rows.json
        run: node scripts/validate-app-asof-cases.mjs > log.txt 2>&1 || (tail -30 log.txt; exit 1)
      - run: tail -4 log.txt || true
        if: always()
      - id: nm
        run: echo "n=$(echo '${{ matrix.prefix }}' | tr ',' '_')" >> $GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aptold-${{ steps.nm.outputs.n }}
          path: rows.json
          if-no-files-found: ignore
          retention-days: 14
  compare:
    needs: collect
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests scikit-learn
      - uses: actions/download-artifact@v4
        with:
          pattern: aptold-*
          path: aptwide
      - uses: actions/download-artifact@v4
        with:
          pattern: aptwide-*
          path: aptwide
          run-id: 43879534628
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}
          PYTHONUNBUFFERED: '1'
          WB_WIDECMP_DIR: aptwide
          WRITE_BACK: '0'
        run: python analyze-bidcases.py
