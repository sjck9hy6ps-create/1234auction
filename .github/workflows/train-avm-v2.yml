# AVM v2 학습(검증용, 수동 실행) - 2026-10
# train-avm.py 상단 "v2" 주석 참고: 시군구×분기 시점효과, 최근 4년 학습, 빌라 건물 단위 효과, 시간분할 검증.
# apt_v2/villa_v2로 따로 저장되므로 지금 앱이 쓰는 v1(apt_v1/villa_v1)에는 영향 없음.
# 검증 통과 후 train-avm.yml을 v2로 바꾸고 data-coverage.js AVM_DEFAULT_VERSION을 'v2'로 전환함.
name: Train AVM v2 (검증용)

on:
  workflow_dispatch: {}

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Train AVM v2 (apt)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PYTHONUNBUFFERED: '1'
        run: python train-avm.py apt v2
      - name: Train AVM v2 (villa)
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PYTHONUNBUFFERED: '1'
        run: python train-avm.py villa v2
