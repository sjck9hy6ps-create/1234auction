# 빌라 과거 낙찰 사례 채점용 자료 만들기(2026-11-10) - 2026-06 이후 낙찰 사례마다 '그 당시' 종합 시세·하위값과, 2026-06 이전 사례로만 학습한 낙찰가 모델을 내보냄(시험 구간 정보가 안 새게).
# 멈춤을 피하는 장치(사용자: 시험을 멈추는 게 아니라 멈춤을 피하게): ① 서버가 느리면 중단하지 않고 지수 대기로 기다렸다 계속 ② 같은 작업은 겹쳐 돌지 않음(concurrency) ③ 서버 읽기는 병렬 6줄·한 번만(읽기 실패는 앱의 읽기 도구가 재시도·순차 방식으로 이어감) ④ 외부 API(대장·좌표·공공데이터)는 전혀 부르지 않음
name: Villa cases as-of
on:
  workflow_dispatch:
concurrency:
  group: villa-cases-asof
  cancel-in-progress: false
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: 서버가 한가해질 때까지 기다림(느려도 중단하지 않고 최대 30분 기다린 뒤 계속)
        run: |
          waited=0; wait=20
          while [ $waited -lt 1800 ]; do
            t=$(curl -s -o /dev/null -w "%{http_code} %{time_total}" -m 20 https://1234auction.vercel.app/api/data-coverage || echo "000 99")
            echo "서버 확인: $t"; code=${t%% *}; sec=${t##* }
            if [ "$code" = "200" ] && awk "BEGIN{exit !($sec < 3.0)}"; then break; fi
            echo "느려서 ${wait}초 기다려요"; sleep $wait; waited=$((waited+wait)); wait=$((wait*2)); [ $wait -gt 300 ] && wait=300
          done
          echo "대기 ${waited}초 후 계속"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests scikit-learn scipy
      - name: 공시가격 파일 받기
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl -sf -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" "$SUPABASE_URL/storage/v1/object/data/official-price.jsonl.gz" -o official-price.jsonl.gz && ls -la official-price.jsonl.gz || echo "공시가격 파일 없음"
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COLLECT_PROXY_SECRET: ${{ secrets.COLLECT_PROXY_SECRET }}
          SITE_URL: https://1234auction.vercel.app
          FETCH_THREADS: '6'
          FIT_WINBID: '1'
          NEW_INPUTS: '1'
          EXPORT_CASES: '1'
          PYTHONUNBUFFERED: '1'
        run: python compute-villa-stack.py | tee export-log.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: villa-cases-asof
          path: |
            villa-cases-asof.json
            villa-winbid-pre.json
            export-log.txt
          if-no-files-found: ignore
          retention-days: 30
