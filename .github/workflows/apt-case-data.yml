# 아파트 낙찰사례를 과거 시점으로 되돌려 앱 계산(종합 평가 보정 포함)을 다시 돌림(2026-11-07) - 낙찰가 모델 재학습·채점용
name: Apt case data
on:
  workflow_call:
  push:
    paths: ['.github/triggers/apt-case-data.txt']
  workflow_dispatch:
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        prefix: ['11', '26', '27', '28', '29', '30', '31', '36', '41', '42,51', '43', '44', '45,52', '46', '47', '48', '50']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install playwright
      - run: npx playwright install --with-deps chromium
      - env:
          SITE_URL: https://1234auction.vercel.app
          LAWD_PREFIX: ${{ matrix.prefix }}
          OUT_FILE: rows.json
        run: node scripts/validate-app-asof-cases.mjs > log.txt 2>&1 || (tail -30 log.txt; exit 1)
      - run: tail -4 log.txt || true
        if: always()
      - id: nm
        run: echo "n=$(echo '${{ matrix.prefix }}' | tr ',' '_')" >> $GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aptcases-${{ steps.nm.outputs.n }}
          path: rows.json
          if-no-files-found: ignore
          retention-days: 7
  merge:
    needs: collect
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - uses: actions/download-artifact@v4
        with:
          pattern: aptcases-*
          path: aptcases
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python save-apt-case-stack.py aptcases
      - name: 예상매도가 최근 쏠림 보정 저장(walk-forward 검증 통과 등급만)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python save-sale-corr.py aptcases
      - name: 낙찰 가능성 양방향 보정 저장(시간순 검증 통과 시만 use)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python save-prob-cal.py aptcases
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 세 가격 채점(학습에 안 쓴 구간)
        run: node scripts/score-asof-three-prices.mjs aptcases
      - uses: actions/upload-artifact@v4
        with:
          name: three-price-score
          path: three-price-score.json
          retention-days: 30
