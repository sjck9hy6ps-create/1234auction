name: 검증 - 예상매도가 보정 선택 적용

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SITE_URL: https://1234auction.vercel.app
          PYTHONUNBUFFERED: '1'
          ONLY_JSON: '1'
        run: |
          set -o pipefail
          python backtest-sale-rule.py 2>&1 | tail -20
          python backtest-sale-gate.py 2>&1 | tee gate.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sale-gate
          path: |
            gate.log
            backtest-sale-rule.json
          retention-days: 14
