# 아파트 앱 실제 계산 종단 검증(실거래 기준, 서울) - 푸시 트리거
name: Apt as-of trades
on:
  push:
    paths: ['.github/triggers/asof-trades.txt']
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install @supabase/supabase-js ws playwright
      - run: npx playwright install --with-deps chromium
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SITE_URL: https://1234auction.vercel.app
        run: node scripts/validate-app-asof-trades.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asof-trades
          path: asof-trades.json
          if-no-files-found: ignore
          retention-days: 14
