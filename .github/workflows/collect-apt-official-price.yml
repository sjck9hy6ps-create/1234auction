# 아파트 공시가격 수집(2026-11-19): 입찰후보 → 경매건 → 그 외 전체 아파트 순. 수집기 설명은 collect-apt-official-price.py 맨 위 참고.
# 보관: Supabase 비공개 저장소 data/apt-official-price.jsonl.gz (이어받기용). 매년 5월 15일에 새 연도분을 처음부터 다시 받음(YEAR가 바뀌면 파일을 새로 시작).
name: Collect apt official price
on:
  schedule:
    - cron: '0 19 14 5 *'
  workflow_dispatch:
    inputs:
      sample:
        description: '받을 건물 수 상한(0=전부, 시험은 300 등)'
        default: '0'
      max_min:
        description: '최대 실행 분(넘으면 올리고 멈춤)'
        default: '320'
      threads:
        description: '동시 호출 수'
        default: '8'
      fresh:
        description: '보관 파일 무시하고 처음부터(true)'
        default: 'false'
      retry_empty:
        description: '자료 없던 건물만 옛 시군구 코드로 재시도(1)'
        default: '0'
      fix_gaps:
        description: '결측 보완: 경매 물건 건물 추가 + 인천 분구 옛 법정동코드(1)'
        default: '0'
concurrency:
  group: collect-apt-official-price
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: 보관소 파일 이어받기
        if: ${{ inputs.fresh != 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if curl -sf -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" "$SUPABASE_URL/storage/v1/object/data/apt-official-price.jsonl.gz" -o prev.gz; then gunzip -c prev.gz > apt-official-price.jsonl; wc -l apt-official-price.jsonl; else echo "보관소에 파일 없음: 처음부터"; fi
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COLLECT_PROXY_SECRET: ${{ secrets.COLLECT_PROXY_SECRET }}
          SITE_URL: https://1234auction.vercel.app
          SAMPLE: ${{ inputs.sample || '0' }}
          MAX_MIN: ${{ inputs.max_min || '320' }}
          THREADS: ${{ inputs.threads || '8' }}
          RETRY_EMPTY: ${{ inputs.retry_empty || '0' }}
          FIX_GAPS: ${{ inputs.fix_gaps || '0' }}
          PYTHONUNBUFFERED: '1'
        run: set -o pipefail; python collect-apt-official-price.py | tee collect-log.txt
      - name: 보관소에 올리기
        if: ${{ always() }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          [ -f apt-official-price.jsonl ] || exit 0
          N=$(wc -l < apt-official-price.jsonl); echo "줄 수 $N"; if [ "$N" -lt 100 ]; then echo "자료가 너무 적어 올리지 않음"; exit 0; fi
          gzip -9 -c apt-official-price.jsonl > apt-official-price.jsonl.gz; ls -la apt-official-price.jsonl.gz
          curl -s -X POST "$SUPABASE_URL/storage/v1/bucket" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Content-Type: application/json" -d '{"id":"data","name":"data","public":false}' || true; echo
          curl -sf -X POST "$SUPABASE_URL/storage/v1/object/data/apt-official-price.jsonl.gz" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "x-upsert: true" -H "Content-Type: application/gzip" --data-binary @apt-official-price.jsonl.gz && echo "올림 완료"
      - name: 앱용 자료 올리기(공시가격 필터·세금 계산)
        if: ${{ success() }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COLLECT_PROXY_SECRET: ${{ secrets.COLLECT_PROXY_SECRET }}
          SITE_URL: https://1234auction.vercel.app
          THREADS: '8'
          PYTHONUNBUFFERED: '1'
        run: python publish-apt-official.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apt-official-price
          path: |
            apt-official-price.jsonl
            collect-log.txt
          retention-days: 30
