# 아파트 분양권·입주권 전매 실거래 수집 - 2026-10 (scripts/collect-presale.mjs 상단 설명 참고)
name: Collect presale trades

on:
  workflow_dispatch:
    inputs:
      months:
        description: '받을 개월 수(처음엔 36)'
        required: false
        default: '3'
      only:
        description: '시군구 코드 하나만(시험용, 비우면 전국)'
        required: false
        default: ''
  schedule:
    - cron: '30 2 * * 1'

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install @supabase/supabase-js ws
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}
          COLLECT_PROXY_SECRET: ${{ secrets.COLLECT_PROXY_SECRET }}
          PRESALE_MONTHS: ${{ github.event.inputs.months || '3' }}
          PRESALE_ONLY: ${{ github.event.inputs.only || '' }}
        run: node scripts/collect-presale.mjs
