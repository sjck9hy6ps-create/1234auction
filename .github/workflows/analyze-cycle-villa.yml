# 빌라 사이클 분석(2026-11-10, 수정 요청: 빌라 시세 사이클을 빌라 기준으로) - villa_trades(연립·다세대)로 지수·상승/하락기·6/12개월 예측을 만들어 cyclev|* 로 저장. 매주 월요일 + 수동
name: Analyze villa cycle
on:
  schedule:
    - cron: '30 22 * * 1'
  workflow_dispatch: {}
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PYTHONUNBUFFERED: '1'
        run: python analyze-cycle-villa.py | tee villa-cycle-log.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: villa-cycle-log
          path: villa-cycle-log.txt
          if-no-files-found: ignore
          retention-days: 30
