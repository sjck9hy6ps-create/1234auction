# 남은 아파트 공시가격 결측 사건 원인 조사(읽기만 함)
name: Diag apt remain
on:
  workflow_dispatch: {}
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: 보관소 파일 받기
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl -sf -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" "$SUPABASE_URL/storage/v1/object/data/apt-official-price.jsonl.gz" -o prev.gz && gunzip -c prev.gz > apt-official-price.jsonl
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COLLECT_PROXY_SECRET: ${{ secrets.COLLECT_PROXY_SECRET }}
          SITE_URL: https://1234auction.vercel.app
          PYTHONUNBUFFERED: '1'
        run: |
          set -o pipefail
          python diag-apt-remain3.py | tee diag-log3.txt
      - uses: actions/upload-artifact@v4
        with:
          name: diag-remain
          path: |
            diag-remain.json
            diag-log3.txt
            diag-remain3.json
            diag-log2.txt
