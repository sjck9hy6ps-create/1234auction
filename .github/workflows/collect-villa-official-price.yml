name: Collect villa official price
on:
  workflow_dispatch:
    inputs:
      scale_run_id:
        description: 'Villa data scale 실행 번호(villa-df 보관)'
        default: '43010239831'
      sample:
        description: '건물 표본 수'
        default: '15000'
concurrency:
  group: collect-villa-official-price
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - uses: actions/download-artifact@v4
        with:
          name: villa-df
          path: input
          run-id: ${{ inputs.scale_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - env:
          COLLECT_PROXY_SECRET: ${{ secrets.COLLECT_PROXY_SECRET }}
          SITE_URL: https://1234auction.vercel.app
          SAMPLE: ${{ inputs.sample }}
          PYTHONUNBUFFERED: '1'
        run: set -o pipefail; python collect-villa-official-price.py | tee collect-log.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: villa-official-price
          path: |
            official-price.jsonl
            collect-log.txt
          retention-days: 30
