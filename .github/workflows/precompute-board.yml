name: 입찰후보 계산 미리 해 두기

on:
  schedule:
    - cron: '0 18 * * *'   # 매일 KST 03:00 - 2026-11-18(사용자: 모든 계산을 새벽에 끝내 두어 일과시간에 앱을 열 때 로딩 없이) 앱이 열 때 다시 판정하는 일을 줄이려고 모델·자산·새 물건 반영을 새벽에 미리 함
  workflow_call:       # 주간 파이프라인(weekly-pipeline.yml)이 순서대로 부름
  push:                # 2026-11-04: 트리거 파일을 고쳐 올리면 한 번 실행(git push로 구동)
    paths: ['.github/triggers/precompute-board.txt']
  workflow_dispatch:

concurrency:
  group: precompute-board
  cancel-in-progress: false
jobs:
  precompute:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install @supabase/supabase-js ws playwright
      - run: npx playwright install --with-deps chromium
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SITE_URL: https://1234auction.vercel.app
        run: node scripts/precompute-board.mjs
