# AVM(헤도닉 회귀모델) 주간 재학습 워크플로 - 2026-08 추가
#
# ⚠️ 이 파일은 저장소의 .github/workflows/train-avm.yml 경로에 저장해야 GitHub Actions가
# 인식합니다(GitHub 웹 에디터에서 "Add file" → 경로를 .github/workflows/train-avm.yml로
# 직접 입력하면 됩니다).
#
# ⚠️ 실행 전 GitHub 저장소 Settings → Secrets and variables → Actions에 아래 2개를 등록:
#   SUPABASE_URL              (Vercel에 이미 등록된 것과 동일한 값)
#   SUPABASE_SERVICE_ROLE_KEY (Vercel에 이미 등록된 것과 동일한 값 - service_role 키, anon 키 아님)
# Vercel 환경변수와는 완전히 별개 저장소라 GitHub Actions는 GitHub Secrets에 따로
# 등록해야만 값을 읽을 수 있습니다(값 자체는 Vercel 것과 동일하게 복사해 넣으면 됨).
#
# 매주 월요일 04:00 UTC(한국시간 13:00)에 자동 실행되고, Actions 탭에서 수동 실행도 가능함
# (workflow_dispatch). house_trades가 매일 갱신되긴 하지만 회귀계수가 하루이틀 차이로
# 크게 바뀌진 않으므로 주 1회면 충분함 - 더 자주 돌리고 싶으면 cron만 바꾸면 됨.
name: Train AVM model

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch: {}

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy requests

      # ⚠️ (2026-09, "The hosted runner lost communication with the server." 반복 대응):
      # 아파트(apt_v1)+연립다세대(villa_v1)를 한 파이썬 프로세스에서 순차로 학습하면 메모리가
      # 누적되다 OOM으로 추정되는 원인불명 중단이 반복됨(50분→1시간36분으로 점점 더 늦게
      # 죽는 패턴이 누적을 뒷받침함). train-avm.py가 apt/villa 인자를 받도록 바꿔서, 완전히
      # 별개의 run 스텝(=별개의 프로세스)으로 나눔 - 한 스텝이 끝나 프로세스가 종료되면 OS가
      # 메모리를 100% 회수하므로, 정확한 누수 지점을 못 찾아도 두 모델 간 메모리 누적 자체가
      # 구조적으로 차단됨.
      - name: Train AVM (apt)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # ⚠️ (사용자 문의 대응) 파이썬은 표준출력이 터미널이 아니라 파일/파이프로 리다이렉트되면
          # (GitHub Actions 로그가 바로 이 경우) 기본적으로 완전버퍼링을 씀 - print()가 즉시
          # 로그에 안 뜨고 내부 버퍼가 다 찰 때까지(또는 프로세스 종료 시까지) 쌓여있기만 함.
          # 그래서 실제로는 정상 진행 중이어도 로그가 30분 넘게 완전히 비어 보일 수 있음(사용자가
          # "멈춘 것 같다"고 오인한 원인으로 추정). PYTHONUNBUFFERED=1로 줄단위 즉시 flush시켜
          # 로그가 실시간으로 보이게 함 - 스크립트 동작 자체는 전혀 안 바뀜.
          PYTHONUNBUFFERED: '1'
        run: python train-avm.py apt v2

      - name: Train AVM (villa)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PYTHONUNBUFFERED: '1'
        run: python train-avm.py villa v2
