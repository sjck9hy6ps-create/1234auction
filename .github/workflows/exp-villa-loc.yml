# 빌라 위치 정보(역거리) 시험(2026-11-14)
name: Exp villa loc
on:
  workflow_dispatch:
    inputs:
      official_run_id:
        description: '공시가격 수집 실행 번호'
        default: '43412988488'
      scale_run_id:
        description: 'Villa data scale 실행 번호(villa-df·조각 보관: 조각 14일, 거래 파일 7일)'
        default: '43010239831'
concurrency:
  group: exp-villa-loc
  cancel-in-progress: false
jobs:
  exp:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy scikit-learn scipy requests
      - uses: actions/download-artifact@v4
        with:
          name: villa-df
          path: input
          run-id: ${{ inputs.scale_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: feat-*
          path: shards
          run-id: ${{ inputs.scale_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: villa-official-price
          path: input2
          run-id: ${{ inputs.official_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - env:
          SHARD_GLOB: shards/**/feat-shard-*.pkl
          PYTHONUNBUFFERED: '1'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: set -o pipefail; python exp-villa-loc.py | tee loc-log.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: villa-loc-test
          path: |
            villa-loc-test.json
            loc-log.txt
          if-no-files-found: ignore
          retention-days: 30
