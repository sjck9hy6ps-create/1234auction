name: 지방 시군구 팔리는 곳 후보 순위

on:
  workflow_dispatch:
  schedule:
    - cron: '30 22 * * 4'   # 매주 금요일 KST 07:30 (analyze-bidcases 주간 분석이 끝난 뒤 - 우선 지역을 매주 새로 계산, 2026-10 사용자 요청)

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SITE_URL: https://1234auction.vercel.app
          PYTHONUNBUFFERED: '1'
        run: python analyze-region-liquidity.py
