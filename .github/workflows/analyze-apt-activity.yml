# 아파트 단지 안 '단지 전체 거래 활발도' 검증(2026-11-21) - 설명은 analyze-apt-activity.py 맨 위
name: Analyze apt activity
on:
  workflow_dispatch: {}
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PYTHONUNBUFFERED: '1'
        run: python analyze-apt-activity.py
