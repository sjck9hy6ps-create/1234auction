name: Analyze renovation premium
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy scipy requests
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: set -o pipefail; python analyze-renovation-premium.py | tee reno-log.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renovation-premium
          path: |
            renovation-premium.json
            reno-log.txt
