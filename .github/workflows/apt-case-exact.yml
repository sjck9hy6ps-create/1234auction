# 사건별 정확 순익 기록(2026-11-24) - 낙찰 사례마다 낙찰일 35일 전 자료로 앱 계산을 돌리고, 실제 낙찰가·예상 낙찰가·예상+5%·추천가·최저가에서의 비용·세금·순익(앱의 bidCostLines)을 그대로 저장. 저장 없음(기존 저장값·보정값은 바뀌지 않음)
name: Apt case exact net
on:
  workflow_dispatch:
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        prefix: ['11', '12', '26', '27', '28', '29', '30', '31', '36', '41', '42,51', '43', '44', '45,52', '46', '47', '48', '50']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install playwright
      - run: npx playwright install --with-deps chromium
      - env:
          SITE_URL: https://1234auction.vercel.app
          LAWD_PREFIX: ${{ matrix.prefix }}
          SALE_FROM: '2024-12-01'
          OUT_FILE: rows.json
        run: node scripts/validate-app-asof-cases.mjs > log.txt 2>&1 || (tail -30 log.txt; exit 1)
      - run: tail -4 log.txt || true
        if: always()
      - id: nm
        run: echo "n=$(echo '${{ matrix.prefix }}' | tr ',' '_')" >> $GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aptexact-${{ steps.nm.outputs.n }}
          path: rows.json
          if-no-files-found: ignore
          retention-days: 30
