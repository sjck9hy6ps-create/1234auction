name: 조정 - 예상매도가 반영 비율 재조정

on:
  workflow_dispatch:
    inputs:
      skip_tuning:
        description: '1이면 기존 보정표 계산을 건너뛰고 자료(JSON)만 저장'
        default: ''

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SITE_URL: https://1234auction.vercel.app
          PYTHONUNBUFFERED: '1'
          KEEP_PKL: '1'
          SKIP_TUNING: '${{ github.event.inputs.skip_tuning }}'
        run: python tune-sale-est.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tune-sale-est
          path: tune-sale-est.json
          if-no-files-found: ignore
          retention-days: 14
