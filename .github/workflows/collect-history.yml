name: 아파트 매매 과거 데이터 수집 (수동)

on:
  workflow_dispatch:
    inputs:
      target_year:
        description: '수집할 연도 (예: 2026) - 올해면 1월~이번달까지, 과거연도면 1~12월 전체'
        required: true
        default: '2026'

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 의존성 설치
        run: npm install @supabase/supabase-js ws
      - name: 과거 아파트 매매 데이터 수집 실행
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}
          COLLECT_PROXY_SECRET: ${{ secrets.COLLECT_PROXY_SECRET }}
          TARGET_YEAR: ${{ github.event.inputs.target_year }}
        run: node scripts/collect-history.mjs
