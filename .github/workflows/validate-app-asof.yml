name: 검증 - 앱 실제 출력 종단 검증(과거 시점으로 되돌려 예상매도가 비교)

on:
  workflow_call:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install @supabase/supabase-js ws playwright
      - run: npx playwright install --with-deps chromium
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SITE_URL: https://1234auction.vercel.app
        run: |
          # 실패하면 60초 뒤 다시(최대 3번). 시점별 중간 결과가 asof-partial/에 남아 있어 끝난 시점은 건너뛰고 이어서 함
          ok=0
          for i in 1 2 3; do
            echo "=== 시도 $i/3 ==="
            if node scripts/validate-app-asof.mjs; then ok=1; break; fi
            echo "실패 - 60초 뒤 다시 시도"; sleep 60
          done
          [ "$ok" = "1" ]
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validate-app-asof
          path: validate-app-asof.json
          if-no-files-found: ignore
          retention-days: 14
