# 금리 인상·인하기를 2017-09~ 전체 실거래로 시험(2026-11-15). 앱·서버에 저장하지 않음
name: Analyze macro lead 3
on:
  workflow_dispatch:
jobs:
  a:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests scikit-learn
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SITE_URL: https://1234auction.vercel.app
          PYTHONUNBUFFERED: '1'
        run: python analyze-macro-lead3.py
