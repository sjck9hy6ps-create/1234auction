name: 빌라·단독다가구 과거 전국 백필 (연도 여러 개 순서대로)

on:
  workflow_dispatch:
    inputs:
      years:
        description: '수집할 연도들(콤마, 예: 2021,2020,2019,2018,2017) - 한 해씩 차례로 돌아요'
        required: true
        default: '2021,2020,2019,2018,2017'

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      years: ${{ steps.p.outputs.years }}
    steps:
      - id: p
        run: echo "years=$(echo '${{ github.event.inputs.years }}' | tr -d ' ' | jq -R -c 'split(",")')" >> "$GITHUB_OUTPUT"
  collect:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        year: ${{ fromJSON(needs.plan.outputs.years) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install @supabase/supabase-js ws
      - name: ${{ matrix.year }}년 연립다세대 + 단독/다가구 전국 수집
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}
          COLLECT_PROXY_SECRET: ${{ secrets.COLLECT_PROXY_SECRET }}
          TARGET_YEAR: ${{ matrix.year }}
        run: node scripts/collect-history-villa-single.mjs
