name: 데이터 자동 점검 (거래 건수·지역코드) + 자동 복구

# 매주 화요일 오전 9시(KST) - 월요일 주간 수집(아파트 10:00, 빌라 10:30, 전월세 11:00)이 끝난 뒤.
# 거래 건수가 갑자기 비면 그 지역·그 달을 바로 다시 수집해서 고침(자동 복구).
# 결과는 public/data-health.json으로 커밋 → 앱 상단 배너가 읽어서 보여줌.
# 자동으로 못 고친 문제가 남으면 이 작업이 "실패"로 끝나 GitHub 메일 알림도 감.
# scripts/check-data-health.mjs 상단 주석 참고.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 2'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 의존성 설치
        run: npm install @supabase/supabase-js ws
      - name: 데이터 점검 + 자동 복구 실행
        id: check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}
          COLLECT_PROXY_SECRET: ${{ secrets.COLLECT_PROXY_SECRET }}
        run: node scripts/check-data-health.mjs
      - name: 점검 결과 저장(앱 배너용)
        if: always()
        run: |
          if [ -f public/data-health.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/data-health.json
            git commit -m "데이터 자동 점검 결과 갱신" || exit 0
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi
