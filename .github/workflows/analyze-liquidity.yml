# 인기(거래활발) 단지 검증 + 시군구별 현재 인기 단지 목록 - 2026-10 (analyze-liquidity.py 상단 설명 참고)
name: Analyze popular complexes

on:
  workflow_call:       # 주간 파이프라인(weekly-pipeline.yml)이 순서대로 부름 - 단독 일정은 없앰(2026-10-11)
  workflow_dispatch:
    inputs:
      current_only:
        description: '현재 인기 목록만 갱신(검증 생략)'
        required: false
        default: '0'

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PYTHONUNBUFFERED: '1'
          CURRENT_ONLY: ${{ github.event.inputs.current_only || '0' }}
        run: python analyze-liquidity.py
