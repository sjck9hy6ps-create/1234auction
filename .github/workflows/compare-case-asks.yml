# 한 사건 반경 호가 vs 실거래 vs 앱 예상매도가 비교(2026-11-14, 참고용)
name: Compare case asks
on:
  workflow_dispatch:
    inputs:
      df_run_id:
        description: 'Villa df prepare 실행 번호'
        required: true
      lat: { default: '37.6629017' }
      lon: { default: '126.8319381' }
      area: { default: '36' }
      year: { default: '1991' }
      sale: { description: '앱 예상매도가(만원)', default: '8427' }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy scipy requests
      - uses: actions/download-artifact@v4
        with:
          name: villa-df
          path: input
          run-id: ${{ inputs.df_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LAT: ${{ inputs.lat }}
          LON: ${{ inputs.lon }}
          AREA: ${{ inputs.area }}
          YEAR: ${{ inputs.year }}
          SALE: ${{ inputs.sale }}
        run: set -o pipefail; python compare-case-asks.py | tee case-log.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: case-asks-report
          path: |
            case-asks-report.json
            case-log.txt
