# 빌라 동네 안 상대 연식·승강기 시험(2026-11-14, 측정 전용)
name: Exp villa relative
on:
  workflow_dispatch:
jobs:
  an:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests scikit-learn
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PYTHONUNBUFFERED: '1'
        run: python exp-villa-relative.py | tee relative-log.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: villa-relative
          path: |
            villa-relative.json
            relative-log.txt
          if-no-files-found: ignore
          retention-days: 14
