name: 주간 파이프라인 (수집 → 분석 → 입찰후보 미리 계산)

# 2026-10-11(사용자: 주말에 올리고 월요일에 계산, 평일엔 이 값으로만 사용): 매주 일요일 저녁 8시(KST)에 시작해 아래 순서대로 한 단계씩 실행합니다.
# 각 단계가 끝나면 다음 단계가 시작되어(앞 단계가 실패해도 계속) GitHub 예약 지연(몇 시간 늦게 시작하는 일이 잦음)이 있어도 순서가 뒤집히지 않아요.
# 총 약 6시간 → 월요일 새벽~아침에 끝나고, 새 실거래·낙찰사례·경매 목록이 모두 반영된 미리 계산 결과가 월요일부터 일주일간 쓰여요.
# 단독 실행·수동 실행은 각 워크플로 파일의 '수동 실행'을 그대로 쓰면 됩니다.
on:
  schedule:
    - cron: '0 11 * * 0'   # 매주 일요일 KST 20:00 (UTC 11:00)
  workflow_dispatch:

jobs:
  collect-trades:
    name: 1 아파트·연립 실거래 수집
    uses: ./.github/workflows/weekly.yml
    secrets: inherit
  collect-villa-single:
    name: 2 단독다가구 실거래 수집
    uses: ./.github/workflows/collect-weekly-villa-single.yml
    secrets: inherit
    needs: collect-trades
    if: ${{ !cancelled() }}
  collect-rent:
    name: 3 전월세 수집
    uses: ./.github/workflows/collect-weekly-rent.yml
    secrets: inherit
    needs: collect-villa-single
    if: ${{ !cancelled() }}
  collect-presale:
    name: 4 분양권 수집
    uses: ./.github/workflows/collect-presale.yml
    secrets: inherit
    needs: collect-rent
    if: ${{ !cancelled() }}
  train-avm:
    name: 5 AVM 학습
    uses: ./.github/workflows/train-avm.yml
    secrets: inherit
    needs: collect-presale
    if: ${{ !cancelled() }}
  analyze-cycle:
    name: 6 사이클 분석
    uses: ./.github/workflows/analyze-cycle.yml
    secrets: inherit
    needs: train-avm
    if: ${{ !cancelled() }}
  analyze-liquidity:
    name: 7 환금성·인기 분석
    uses: ./.github/workflows/analyze-liquidity.yml
    secrets: inherit
    needs: analyze-cycle
    if: ${{ !cancelled() }}
  analyze-bidcases:
    name: 8 낙찰사례 분석·낙찰가 모델
    uses: ./.github/workflows/analyze-bidcases.yml
    secrets: inherit
    needs: analyze-liquidity
    if: ${{ !cancelled() }}
  analyze-homestay:
    name: 9 도시민박 집계
    uses: ./.github/workflows/analyze-homestay.yml
    secrets: inherit
    needs: analyze-bidcases
    if: ${{ !cancelled() }}
  analyze-region-liquidity:
    name: 10 우선 지역 분석
    uses: ./.github/workflows/analyze-region-liquidity.yml
    secrets: inherit
    needs: analyze-homestay
    if: ${{ !cancelled() }}
  refit-sale-rule:
    name: 11 예상매도가 보정 갱신(지역·회전율)
    uses: ./.github/workflows/backtest-sale-rule.yml
    secrets: inherit
    needs: analyze-region-liquidity
    if: ${{ !cancelled() }}
  refit-sale-fallback:
    name: 11 거래 부족 추론 보정 갱신
    uses: ./.github/workflows/backtest-sale-fallback.yml
    secrets: inherit
    needs: analyze-region-liquidity
    if: ${{ !cancelled() }}
  refit-sale-jeonse:
    name: 11 전세가율 보정 갱신
    uses: ./.github/workflows/backtest-sale-jeonse.yml
    secrets: inherit
    needs: analyze-region-liquidity
    if: ${{ !cancelled() }}
  precompute-board:
    name: 12 입찰후보 전체 미리 계산
    uses: ./.github/workflows/precompute-board.yml
    secrets: inherit
    needs: [refit-sale-rule, refit-sale-fallback, refit-sale-jeonse]
    if: ${{ !cancelled() }}
  score-bid-objects:
    name: 13 입찰 경쟁·등수·환금성 점수
    uses: ./.github/workflows/score-bid-objects.yml
    secrets: inherit
    needs: precompute-board
    if: ${{ !cancelled() }}
  pipeline-summary:
    name: 14 결과 요약 저장
    uses: ./.github/workflows/pipeline-summary.yml
    secrets: inherit
    needs: score-bid-objects
    if: ${{ always() }}

