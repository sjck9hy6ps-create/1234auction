name: 지역별 실거래 캐시 웜업

on:
  workflow_dispatch:
  schedule:
    # 매주 월요일 UTC 18:30(KST 03:30) - 좌표/건축물대장 웜업(03:00) 직후에 실행되도록 30분 뒤로 배치.
    # 국토부 실시간 API는 호출하지 않고(skipRealtime=1) DB분만 캐싱하므로 할당량과 무관.
    # ⚠️ 2026-08: 원래 매일 실행이었으나, 1인 개인앱 기준 Vercel 무료 플랜(월 100만 함수
    # 호출) 한도를 넘겨(월 200만) 확인해보니 이 웜업이 "이미 처리한 지역이라도 매일
    # 무조건 다시 호출"하는 구조라 지역 수(전국 기준 수백 곳) × 30일치가 그대로 낭비되고
    # 있었음. get-house.js가 이제 엣지에서 5분 캐시되고 Redis 캐시(10시간)도 있어서,
    # 웜업 없이 첫 방문 시 새로 조회돼도 체감 지연이 크지 않아 주 1회로 낮춤.
    - cron: '30 18 * * 1'

jobs:
  warmup-house-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 의존성 설치
        run: npm install @supabase/supabase-js ws
      - name: get-house 캐시 웜업 실행
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SITE_URL: https://1234auction.vercel.app
        run: node scripts/warmup-house-cache.mjs
